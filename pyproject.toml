[project]
name = "mannequin-x"
version = "0.1.0"
description = "Rigid and skinned mannequins driven directly by SMPL-X motion"
readme = "README.md"
authors = [
    { name = "Andrea Boscolo Camiletto", email = "abcamiletto@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.2.28",
    "nanomanifold>=0.8.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
viser = ["viser>=0.2.0"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mannequin"

[dependency-groups]
dev = [
    "body-models>=0.24.1",
    "ruff>=0.16.0",
    "ty>=0.0.1a13",
    "viser>=0.2.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F722", "F821", "UP037"]

[tool.ty.src]
exclude = ["authoring/"]
